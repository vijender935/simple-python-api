[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-python-api"
version = "0.1.2"
description = "Simple FastAPI application"
authors = [{ name = "Vijender" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.13.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
    "black>=24,<26",
]

[tool.setuptools]
py-modules = ["main"]
